name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, PostgreSQL & Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
        env:
          POSTGRES_DB: nat1_ci
          POSTGRES_USER: nat1_ci
          POSTGRES_PASSWORD: nat1_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nat1_ci -d nat1_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
      DATABASE_URL: postgresql+psycopg://nat1_ci:nat1_ci_password@localhost:5432/nat1_ci
      ENVIRONMENT: testing
      SECRET_KEY: ci-only-secret-not-used-outside-this-ephemeral-job
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint backend
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m pytest --ignore=tests/integration

      - name: Apply and inspect migrations
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check

      - name: Run PostgreSQL integration test
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: python -m pytest tests/integration

      - name: Prove migration reversibility
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check

      - name: Verify the re-applied schema
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        run: python -m pytest tests/integration

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.lock

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
