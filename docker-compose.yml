services:
  postgres:
    image: postgres:16@sha256:4b7183ac05f8ef417db21fd72d71047a4238340c261d3cc3ddb6d579ab5071ae
    container_name: nat1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nat1_db
      POSTGRES_USER: nat1_user
      POSTGRES_PASSWORD: nat1_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nat1_user -d nat1_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - nat1_postgres_data:/var/lib/postgresql/data

volumes:
  nat1_postgres_data:
